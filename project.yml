name: Vynscope
options:
  bundleIdPrefix: com.smidley
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5CNQA36678            # Scott Brant
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO                  # as Dustpan
    ENABLE_ENHANCED_SECURITY: YES           # as Dustpan
    ENABLE_POINTER_AUTHENTICATION: NO       # arm64e would need the Core package built for arm64e too
packages:
  BMWCodingCore:
    path: Core
targets:
  Vynscope:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: BMWCodingCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vynscope
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Talks to the OBDLink CX adapter in the car.
        UIBackgroundModes: [bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/Vynscope.entitlements
      properties:
        com.apple.security.hardened-process: true
        com.apple.security.hardened-process.enhanced-security-version-string: "2"
        com.apple.security.hardened-process.hardened-heap: true
        com.apple.security.hardened-process.dyld-ro: true
        com.apple.security.hardened-process.platform-restrictions-string: "2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smidley.vynscope
        ASSETCATALOG_COMPILER_APPICON_NAME: ""   # no app icon yet; the asset catalog holds the ChatGPT logo
schemes:
  Vynscope:
    build:
      targets:
        Vynscope: all
    run:
      config: Debug
